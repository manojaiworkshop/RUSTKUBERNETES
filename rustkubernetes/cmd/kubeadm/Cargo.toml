[package]
name = "kubeadm"
description = "Cluster bootstrap tool (Rust port, certificate and kubeconfig phases)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kubeadm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
time = "0.3"
x509-parser.workspace = true
chrono.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
k8s-client-go.workspace = true
k8s-api.workspace = true
k8s-apimachinery.workspace = true
tokio.workspace = true
ring = "0.17"

[dev-dependencies]
x509-parser = { workspace = true, features = ["verify"] }

[lints]
workspace = true
